services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radiology-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Explicit comma-separated list — no wildcards (required when allow_credentials=True).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - radiology-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No build args needed — BACKEND_URL is a runtime env var, read by next.config.ts
      # rewrites() on the Next.js server process, never baked into the client bundle.
    container_name: radiology-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      # BACKEND_URL points to the backend *service name* on the shared Docker network.
      # Using the service name (http://backend:8000) is portable across Docker Desktop
      # (Mac/Windows) and native Linux Docker — host.docker.internal requires
      # extra_hosts: [host.docker.internal:host-gateway] on Linux and is unnecessary
      # here since both services share radiology-network in this same compose file.
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - radiology-network

networks:
  radiology-network:
    driver: bridge
